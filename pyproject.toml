[project]
name = "clear-skies-kubernetes"
description = "Kubernetes module for Clearskies"
version = "0.9.0"
license = "MIT"
readme = "./README.md"
authors = [{name = "Conor Mancone", email = "cmancone@gmail.com"}]
requires-python = ">=3.11,<4.0"
dependencies = [
    "clear-skies>=2.0.0,<3.0.0",
    "kubernetes>=36.0.3",
    "pyhelm3>=0.5.6",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers"
]

[project.urls]
Docs = "https://https://clearskies.info//modules/clear-skies-kubernetes"
Repository = "https://github.com/clearskies-py/kubernetes"
Issues = "https://github.com/clearskies-py/kubernetes/issues"
Changelog = "https://github.com/clearskies-py/kubernetes/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "types-requests>=2.32.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearskies_kubernetes"]

[tool.hatch.build]
exclude = [
    "src/clearskies_kubernetes/*_test.py",
    "src/clearskies_kubernetes/**/*_test.py",
    "src/clearskies_kubernetes/integration_tests/*",
    "docs/**",
    "tests/**"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
    "integration",
]
pythonpath = [
  "app"
]

# This is the dedicated section for uv"s configuration
[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.10",
    "ty>=0.0.35"
]
docs = [
    "clear-skies-doc-builder>=2.0.4",
]
